<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 248" role="img" aria-labelledby="bm-title">
  <title id="bm-title">Bangkok Mango — Taste of Thailand</title>
  <defs>
    <linearGradient id="bm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2BC72"/>
      <stop offset="1" stop-color="#B08341"/>
    </linearGradient>
    <!-- Stepped Thai prang tower, base at (0,0), tip at (0,-90) -->
    <polygon id="bm-prang" fill="url(#bm-gold)" points="
      0,-90 2,-73 5,-73 4,-66 8,-66 7,-59 11,-59 10,-52 14,-52 13,-45
      17,-45 16,-38 20,-38 18,-31 15,-31 15,-27 21,-27 21,-22 17,-22 17,-4
      20,-4 20,0 -20,0 -20,-4 -17,-4 -17,-22 -21,-22 -21,-27 -15,-27 -15,-31
      -18,-31 -20,-38 -16,-38 -17,-45 -13,-45 -14,-52 -10,-52 -11,-59 -7,-59
      -8,-66 -4,-66 -5,-73 -2,-73"/>
    <!-- Small outer finial spire, base at (0,0) -->
    <polygon id="bm-finial" fill="url(#bm-gold)" points="0,-30 3,-8 5,-8 5,0 -5,0 -5,-8 -3,-8"/>
  </defs>

  <!-- Temple: central prang, two flanking prangs, two outer finials, pedestal -->
  <use href="#bm-prang" transform="translate(210 96)"/>
  <use href="#bm-prang" transform="translate(174 96) scale(0.68)"/>
  <use href="#bm-prang" transform="translate(246 96) scale(0.68)"/>
  <use href="#bm-finial" transform="translate(146 96)"/>
  <use href="#bm-finial" transform="translate(274 96)"/>
  <rect x="150" y="96" width="120" height="3" rx="1.5" fill="url(#bm-gold)"/>
  <rect x="134" y="101" width="152" height="3" rx="1.5" fill="url(#bm-gold)"/>

  <!-- Wordmark: both lines justified to the same width, as on the pack -->
  <text x="210" y="155" text-anchor="middle" textLength="300" lengthAdjust="spacing"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="46" fill="#24211E">BANGKOK</text>
  <text x="210" y="203" text-anchor="middle" textLength="300" lengthAdjust="spacing"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="46" fill="#24211E">MANGO</text>

  <!-- Tagline with flanking gold rules -->
  <line x1="72" y1="223" x2="136" y2="223" stroke="#C39A57" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="284" y1="223" x2="348" y2="223" stroke="#C39A57" stroke-width="1.6" stroke-linecap="round"/>
  <text x="210" y="229" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="17" font-style="italic" fill="#7A1233">Taste of Thailand</text>
</svg>
