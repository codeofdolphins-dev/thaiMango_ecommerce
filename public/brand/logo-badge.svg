<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="bmb-title">
  <title id="bmb-title">Bangkok Mango</title>
  <defs>
    <linearGradient id="bmb-burgundy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1233"/>
      <stop offset="1" stop-color="#52091E"/>
    </linearGradient>
    <linearGradient id="bmb-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2BC72"/>
      <stop offset="1" stop-color="#B08341"/>
    </linearGradient>
    <polygon id="bmb-prang" fill="url(#bmb-gold)" points="
      0,-90 2,-73 5,-73 4,-66 8,-66 7,-59 11,-59 10,-52 14,-52 13,-45
      17,-45 16,-38 20,-38 18,-31 15,-31 15,-27 21,-27 21,-22 17,-22 17,-4
      20,-4 20,0 -20,0 -20,-4 -17,-4 -17,-22 -21,-22 -21,-27 -15,-27 -15,-31
      -18,-31 -20,-38 -16,-38 -17,-45 -13,-45 -14,-52 -10,-52 -11,-59 -7,-59
      -8,-66 -4,-66 -5,-73 -2,-73"/>
  </defs>

  <!-- Burgundy coin with a thin gold ring -->
  <circle cx="48" cy="48" r="47" fill="url(#bmb-burgundy)"/>
  <circle cx="48" cy="48" r="42.5" fill="none" stroke="#C39A57" stroke-width="1.4"/>

  <!-- Cream Thai-arch window, ogee peak, matching the pack panel -->
  <path fill="#F7F1E6" d="M22,80 V50 C22,40 32,34 42,28 C46,25.5 47,23 48,18
        C49,23 50,25.5 54,28 C64,34 74,40 74,50 V80 Z"/>

  <!-- Gold temple inside the arch -->
  <use href="#bmb-prang" transform="translate(48 74) scale(0.5)"/>
  <use href="#bmb-prang" transform="translate(34 74) scale(0.32)"/>
  <use href="#bmb-prang" transform="translate(62 74) scale(0.32)"/>
  <rect x="30" y="74.5" width="36" height="2" rx="1" fill="url(#bmb-gold)"/>
</svg>
